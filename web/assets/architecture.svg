<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" role="img" aria-labelledby="title desc">
  <title id="title">NETSHIELD five-zone network design</title>
  <desc id="desc">A planned OPNsense policy boundary connects five explicitly segmented zones. Testing remains isolated; monitoring is read only.</desc>
  <defs><linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff9c63"/><stop offset="1" stop-color="#e75e38"/></linearGradient></defs>
  <rect x="18" y="18" width="664" height="384" rx="24" fill="#17232d" stroke="#46545e"/>
  <rect x="265" y="150" width="170" height="115" rx="18" fill="url(#edge)"/>
  <text x="350" y="194" text-anchor="middle" fill="#17232d" font-family="Arial,sans-serif" font-size="19" font-weight="700">POLICY GATE</text>
  <text x="350" y="222" text-anchor="middle" fill="#24313b" font-family="Arial,sans-serif" font-size="13">OPNsense · planned</text>
  <g fill="none" stroke="#91a2aa" stroke-width="2"><path d="M155 92 265 168M545 92 435 168M155 328 265 248M545 328 435 248M350 62v88M350 265v90"/></g>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <g><rect x="42" y="48" width="170" height="86" rx="14" fill="#263540" stroke="#f29a63"/><text x="127" y="83" fill="#ffe0c9" font-size="15" font-weight="700">ADMIN · VLAN 10</text><text x="127" y="108" fill="#c1cdd1" font-size="12">named management sources</text></g>
    <g><rect x="488" y="48" width="170" height="86" rx="14" fill="#263540" stroke="#86ccd0"/><text x="573" y="83" fill="#c9f3f1" font-size="15" font-weight="700">SERVER · VLAN 20</text><text x="573" y="108" fill="#c1cdd1" font-size="12">DNS · DHCP · NTP</text></g>
    <g><rect x="42" y="286" width="170" height="86" rx="14" fill="#263540" stroke="#b8a7f4"/><text x="127" y="321" fill="#e3dcff" font-size="15" font-weight="700">APPLICATION · 30</text><text x="127" y="346" fill="#c1cdd1" font-size="12">explicit dependencies</text></g>
    <g><rect x="488" y="286" width="170" height="86" rx="14" fill="#263540" stroke="#ee916a"/><text x="573" y="321" fill="#ffddcf" font-size="15" font-weight="700">TESTING · VLAN 40</text><text x="573" y="346" fill="#c1cdd1" font-size="12">no production route</text></g>
    <g><rect x="260" y="337" width="180" height="52" rx="13" fill="#263540" stroke="#8bd1a2"/><text x="350" y="360" fill="#d4ffe0" font-size="13" font-weight="700">MONITORING · VLAN 50</text><text x="350" y="378" fill="#c1cdd1" font-size="11">read-only probes</text></g>
  </g>
  <text x="350" y="30" text-anchor="middle" fill="#f5a578" font-family="Arial,sans-serif" font-size="11" letter-spacing="2">DESIGNED TOPOLOGY · RFC 5737 EXAMPLE RANGES</text>
</svg>
